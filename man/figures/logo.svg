
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 347" width="300" height="347" role="img" aria-label="bGMYC4 logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7FCF5"/>
      <stop offset="42%" stop-color="#A1D99B"/>
